<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fugas - Prospecta</title>
    
    <meta name="description" content="Descubre exactamente cuánto dinero estás perdiendo este mes en WhatsApp y cómo recuperarlo con nuestro diagnóstico gratuito.">
    <meta name="author" content="Prospecta">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #020617; }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] { -moz-appearance: textfield; }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-track { background: transparent; }
        .chat-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Estrellas y Constelaciones ---
        const headerStars = Array.from({ length: 60 }).map((_, i) => ({
          id: i,
          x: Math.random() * 600,
          y: Math.random() * 200,
          r: Math.random() * 1.5 + 0.5,
          opacity: Math.random() * 0.4 + 0.1,
          dur: `${Math.random() * 3 + 2}s`,
          delay: `${Math.random() * 2}s`
        }));

        function BackgroundConstellations() {
          return (
            <div className="fixed top-0 left-0 w-full h-full pointer-events-none overflow-hidden z-0 opacity-40">
              <svg viewBox="0 0 600 200" preserveAspectRatio="xMidYMid slice" className="w-full h-full">
                <defs>
                  <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="1.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                  </filter>
                </defs>
                {headerStars.map((star) => (
                  <circle key={star.id} cx={star.x} cy={star.y} r={star.r} fill="white" opacity={star.opacity}>
                    <animate attributeName="opacity" values={`${star.opacity};1;${star.opacity}`} dur={star.dur} begin={star.delay} repeatCount="indefinite" />
                  </circle>
                ))}
                {/* LEO y PISCIS centradas */}
                <g filter="url(#starGlow)" transform="translate(85, 10) scale(0.45)">
                  <g stroke="rgba(255, 240, 200, 0.3)" strokeWidth="1.5" strokeDasharray="3 4" fill="none">
                    <path d="M 60 140 L 45 90 L 80 40 L 115 25 L 130 50" />
                    <path d="M 60 140 L 160 170 L 180 110 L 80 40" />
                    <path d="M 180 110 L 250 130 L 160 170" />
                  </g>
                  <g fill="white">
                    <circle cx="60" cy="140" r="5" /><circle cx="45" cy="90" r="3" /><circle cx="80" cy="40" r="4" />
                    <circle cx="115" cy="25" r="3" /><circle cx="130" cy="50" r="3" /><circle cx="160" cy="170" r="4" />
                    <circle cx="180" cy="110" r="4.5" /><circle cx="250" cy="130" r="4.5" />
                  </g>
                </g>
                <g filter="url(#starGlow)" transform="translate(255, 10) scale(0.45)">
                  <g stroke="rgba(255, 240, 200, 0.3)" strokeWidth="1.5" strokeDasharray="3 4" fill="none">
                    <path d="M 450 170 Q 480 110 540 50" /><path d="M 450 170 Q 400 140 330 80" />
                    <path d="M 540 50 L 565 30 L 585 55 L 555 70 Z" /><path d="M 330 80 L 305 60 L 285 75 L 305 100 Z" />
                  </g>
                  <g fill="white">
                    <circle cx="450" cy="170" r="5" /><circle cx="540" cy="50" r="3" /><circle cx="565" cy="30" r="3" />
                    <circle cx="585" cy="55" r="3" /><circle cx="555" cy="70" r="3" /><circle cx="330" cy="80" r="3" />
                    <circle cx="305" cy="60" r="3" /><circle cx="285" cy="75" r="3" /><circle cx="305" cy="100" r="3" />
                  </g>
                </g>
              </svg>
            </div>
          );
        }

        // Iconos
        const TrendingDownIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"></polyline><polyline points="16 17 22 17 22 11"></polyline></svg>
        );
        const ShieldAlertIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="M12 8v4"></path><path d="M12 16h.01"></path></svg>
        );
        const ArrowRightIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        );
        const StarIcon = ({ className, style }) => (
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" className={className} style={style}><path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" /></svg>
        );

        function App() {
          const [step, setStep] = useState(0); // 0: Portada, 1: Chat
          const [isHovered, setIsHovered] = useState(false);
          const messagesEndRef = useRef(null);
          const [messages, setMessages] = useState([]);
          const [isTyping, setIsTyping] = useState(false);
          const [inputMode, setInputMode] = useState('none');
          const [inputValue, setInputValue] = useState('');
          const [formData, setFormData] = useState({ prospectos: 0, valor: 0, perdidos: 0, perdidaMensual: 0 });

          const formatCurrency = (value) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(value);

          const typeMessage = async (msgObj, delay = 1500) => {
            setIsTyping(true);
            return new Promise(resolve => {
              setTimeout(() => {
                setIsTyping(false);
                setMessages(prev => [...prev, msgObj]);
                resolve();
              }, delay);
            });
          };

          const startChat = async () => {
            setStep(1);
            await typeMessage({ id: 1, sender: 'bot', type: 'text', content: <p>¡Hola! Empecemos con el diagnóstico. Como te mencioné, vamos a detectar las fugas.</p> }, 1000);
            await typeMessage({ id: 2, sender: 'bot', type: 'text', content: <p>¿Cuántos prospectos te contactan al mes actualmente?</p> }, 1000);
            setInputMode('prospectos');
          };

          const handleSend = async (e) => {
            if (e) e.preventDefault();
            if (!inputValue.trim()) return;
            const userText = inputValue;
            setInputValue('');
            setMessages(prev => [...prev, { id: Date.now(), sender: 'user', type: 'text', content: <p>{userText}</p> }]);

            if (inputMode === 'prospectos') {
              setInputMode('none');
              setFormData(prev => ({ ...prev, prospectos: parseFloat(userText) || 0 }));
              await typeMessage({ id: Date.now()+1, sender: 'bot', type: 'text', content: <p>¿Cuál es el valor promedio de tu servicio o producto?</p> });
              setInputMode('valor');
            } else if (inputMode === 'valor') {
              setInputMode('none');
              setFormData(prev => ({ ...prev, valor: parseFloat(userText) || 0 }));
              await typeMessage({ id: Date.now()+1, sender: 'bot', type: 'text', content: <p>¿Cuántos de esos prospectos te dejan "en visto" o dicen "lo voy a pensar"?</p> });
              setInputMode('perdidos');
            } else if (inputMode === 'perdidos') {
              setInputMode('none');
              const perdidos = parseFloat(userText) || 0;
              const nuevaPerdida = perdidos * formData.valor;
              setFormData(prev => ({ ...prev, perdidos, perdidaMensual: nuevaPerdida }));
              await typeMessage({ id: Date.now()+1, sender: 'bot', type: 'text', content: <p className="italic text-slate-400">Analizando tus datos...</p> }, 1200);
              await typeMessage({ id: Date.now()+2, sender: 'bot', type: 'result_box', content: { title: 'El Resultado: Tu Impuesto por Inacción.', monto: formatCurrency(nuevaPerdida), anual: formatCurrency(nuevaPerdida * 12) }}, 2000);
              await typeMessage({ id: Date.now()+3, sender: 'bot', type: 'text', content: <p>Este es el dinero exacto que le estás regalando a tu competencia ruidosa. Cada día que sigues improvisando, esta cifra aumenta.</p> }, 1500);
              setMessages(prev => [...prev, { id: Date.now()+4, sender: 'bot', type: 'button', text: 'Ver qué significa esto para mi negocio', action: 'ver_impacto' }]);
            }
          };

          const handleButtonClick = async (action, btnText) => {
            setMessages(prev => prev.filter(m => m.type !== 'button').concat({ id: Date.now(), sender: 'user', type: 'text', content: <p>{btnText}</p> }));
            if (action === 'ver_impacto') {
              await typeMessage({ id: Date.now()+1, sender: 'bot', type: 'text', content: <p>Esos <strong className="text-red-400">{formatCurrency(formData.perdidaMensual * 12)}</strong> anuales representan tu tranquilidad financiera y el tiempo libre que hoy no tienes.</p> }, 1500);
              setMessages(prev => [...prev, { id: Date.now()+2, sender: 'bot', type: 'button', text: '¿Cómo detengo esta fuga?', action: 'ver_tips' }]);
            } else if (action === 'ver_tips') {
              await typeMessage({ id: Date.now()+1, sender: 'bot', type: 'text', content: <p><strong className="text-blue-400">Tips de Emergencia:</strong><br/>1. Elimina el "A sus órdenes".<br/>2. No envíes catálogo sin contexto.<br/>3. Responde en menos de 5 min.</p> }, 2000);
              setMessages(prev => [...prev, { id: Date.now()+2, sender: 'bot', type: 'button', text: 'Ver la Solución Definitiva', action: 'ver_solucion' }]);
            } else if (action === 'ver_solucion') {
              await typeMessage({ id: Date.now()+1, sender: 'bot', type: 'text', content: <p>Instalamos la Arquitectura de Persuasión para que el cliente te 'jale' hacia la venta. ¿Te parece justo una auditoría de 15 min?</p> }, 2000);
              setMessages(prev => [...prev, { id: Date.now()+2, sender: 'bot', type: 'final_cta' }]);
            }
          };

          return (
            <div className="min-h-screen bg-slate-950 flex flex-col items-center justify-center font-sans text-slate-100 relative overflow-hidden">
              <BackgroundConstellations />

              {step === 0 ? (
                /* PORTADA ORIGINAL RECONSTRUIDA */
                <div className="relative z-10 w-full max-w-2xl p-4 animate-in fade-in zoom-in duration-700">
                  <div className="bg-white/[0.03] backdrop-blur-xl border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
                    <div className="h-1.5 w-full bg-gradient-to-r from-red-500 via-orange-500 to-amber-500"></div>
                    <div className="p-8 md:p-12 text-center">
                      <div className="flex justify-center mb-8">
                        <div className="bg-red-500/10 p-4 rounded-2xl border border-red-500/20 shadow-[0_0_30px_rgba(239,68,68,0.2)]">
                          <TrendingDownIcon className="w-10 h-10 text-red-400" />
                        </div>
                      </div>
                      <h1 className="text-3xl md:text-4xl font-extrabold leading-tight mb-6">
                        La Calculadora de <span className="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-orange-400">"Fugas de Capital"</span>:
                        <br/>
                        <span className="text-2xl md:text-3xl font-semibold text-slate-300 mt-2 block">
                          Descubre cuánto dinero pierdes en WhatsApp.
                        </span>
                      </h1>
                      <div className="space-y-5 text-slate-300 text-lg mb-10">
                        <p>La mayoría de los profesionales creen que su problema es la falta de prospectos. <strong>Falso.</strong> Tu problema es que tienes una tubería rota.</p>
                      </div>
                      <div className="bg-red-950/30 border border-red-900/50 rounded-xl p-5 flex items-start gap-4 mb-10 text-left">
                        <ShieldAlertIcon className="w-6 h-6 text-red-400 flex-shrink-0" />
                        <p className="text-red-200 text-sm italic"><strong>Advertencia:</strong> Ver tus propios números suele ser incómodo.</p>
                      </div>
                      <button 
                        onClick={startChat}
                        onMouseEnter={() => setIsHovered(true)} onMouseLeave={() => setIsHovered(false)}
                        className="group relative inline-flex items-center gap-3 px-8 py-4 bg-gradient-to-r from-orange-500 to-red-600 text-white text-lg font-bold rounded-full transition-all shadow-[0_0_20px_rgba(239,68,68,0.3)] hover:scale-105"
                      >
                        <div className="absolute inset-0 overflow-hidden rounded-full">
                           <StarIcon className="absolute top-2 left-6 w-3 h-3 animate-pulse" />
                           <StarIcon className="absolute bottom-2 right-8 w-3 h-3 animate-pulse" />
                        </div>
                        <span className="relative z-10 uppercase tracking-wide">Iniciar Diagnóstico</span>
                        <ArrowRightIcon className={`relative z-10 w-5 h-5 transition-transform ${isHovered ? 'translate-x-1' : ''}`} />
                      </button>
                    </div>
                  </div>
                </div>
              ) : (
                /* INTERFAZ DE CHAT */
                <div className="w-full max-w-2xl h-[100dvh] md:h-[90vh] flex flex-col relative z-10 bg-white/[0.02] backdrop-blur-xl md:border md:border-white/10 md:rounded-3xl shadow-2xl overflow-hidden animate-in slide-in-from-bottom-8 duration-500">
                  <div className="p-4 bg-slate-950/80 border-b border-white/10 flex items-center gap-4">
                    <div className="w-8 h-8 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 flex items-center justify-center">
                       <span className="text-xs font-bold text-white">P</span>
                    </div>
                    <h1 className="font-bold text-white text-lg">Estratega Prospecta</h1>
                  </div>

                  <div className="flex-1 overflow-y-auto chat-scroll p-4 space-y-6">
                    {messages.map((msg) => (
                      <div key={msg.id} className={`flex w-full ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] ${msg.type === 'result_box' ? 'w-full' : ''}`}>
                          {msg.type === 'text' && (
                            <div className={`p-4 rounded-2xl text-sm md:text-base ${msg.sender === 'user' ? 'bg-orange-600 text-white rounded-tr-sm' : 'bg-slate-800 border border-slate-700 text-slate-200 rounded-tl-sm'}`}>
                              {msg.content}
                            </div>
                          )}
                          {msg.type === 'result_box' && (
                            <div className="bg-red-950/60 border border-red-500/50 rounded-3xl p-6 text-center">
                              <h3 className="text-lg font-bold mb-4">{msg.content.title}</h3>
                              <h4 className="text-4xl font-black text-red-500 mb-2">{msg.content.monto} <span className="text-sm">/ mes</span></h4>
                              <p className="text-red-200">Equivale a <strong className="text-white">{msg.content.anual}</strong> al año.</p>
                            </div>
                          )}
                          {msg.type === 'button' && (
                            <button onClick={() => handleButtonClick(msg.action, msg.text)} className="w-full mt-2 p-4 bg-slate-800 border border-amber-500/50 text-amber-400 font-bold rounded-xl hover:bg-slate-700 transition-all">
                              {msg.text}
                            </button>
                          )}
                          {msg.type === 'final_cta' && (
                            <a href="https://wa.me/524425480329?text=Agendar%20mi%20Auditor%C3%ADa%20Gratuita" target="_blank" className="w-full mt-4 flex items-center justify-center gap-3 p-5 bg-emerald-600 text-white font-black rounded-2xl shadow-lg">
                              Agendar Auditoría y Detener la Fuga
                            </a>
                          )}
                        </div>
                      </div>
                    ))}
                    {isTyping && <div className="text-xs text-slate-500 animate-pulse">Estratega escribiendo...</div>}
                    <div ref={messagesEndRef} />
                  </div>

                  <form onSubmit={handleSend} className="p-4 bg-slate-950 border-t border-white/10 flex gap-2">
                    <input 
                      type={inputMode === 'none' ? 'text' : 'number'}
                      value={inputValue} onChange={(e) => setInputValue(e.target.value)}
                      disabled={inputMode === 'none'}
                      placeholder={inputMode === 'none' ? 'Espera...' : 'Escribe tu respuesta...'}
                      className="flex-1 bg-slate-900 border border-slate-800 rounded-full px-5 py-3 outline-none focus:border-amber-500"
                    />
                    <button type="submit" disabled={!inputValue.trim()} className="bg-amber-500 p-3 rounded-full text-slate-900">
                      <ArrowRightIcon className="w-5 h-5" />
                    </button>
                  </form>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
